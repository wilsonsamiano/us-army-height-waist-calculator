[package]
name = "army-whtr-calculator"
version = "1.0.0"
description = "U.S. Army height and waist calculator (AD 2026-13 / AR 600-9)"
authors = ["Wilson Samiano"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "army_whtr_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
